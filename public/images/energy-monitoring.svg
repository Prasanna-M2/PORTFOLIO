<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14121d" />
      <stop offset="100%" stop-color="#0d0d12" />
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a476ff" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <pattern id="grid1" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#ffffff08" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg1)" />
  <rect width="800" height="500" fill="url(#grid1)" />

  <!-- Subtle Glow -->
  <circle cx="400" cy="240" r="190" fill="#a476ff" opacity="0.08" />

  <!-- ESP32 Module -->
  <rect x="110" y="150" width="160" height="200" rx="14" fill="#181822" stroke="#a476ff55" stroke-width="2" />
  <rect x="142" y="166" width="96" height="64" rx="6" fill="#232334" stroke="#ffffff20" />
  <text x="190" y="203" fill="#dfdfdf" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">ESP32</text>
  <rect x="155" y="255" width="70" height="55" rx="4" fill="#101018" stroke="#a476ff40" />
  <text x="190" y="287" fill="#a476ff" font-family="monospace" font-size="13" text-anchor="middle">MCU</text>
  <!-- Pins -->
  <g fill="#a476ff88">
    <circle cx="122" cy="180" r="4" /><circle cx="122" cy="200" r="4" /><circle cx="122" cy="220" r="4" /><circle cx="122" cy="240" r="4" /><circle cx="122" cy="260" r="4" /><circle cx="122" cy="280" r="4" /><circle cx="122" cy="300" r="4" /><circle cx="122" cy="320" r="4" />
    <circle cx="258" cy="180" r="4" /><circle cx="258" cy="200" r="4" /><circle cx="258" cy="220" r="4" /><circle cx="258" cy="240" r="4" /><circle cx="258" cy="260" r="4" /><circle cx="258" cy="280" r="4" /><circle cx="258" cy="300" r="4" /><circle cx="258" cy="320" r="4" />
  </g>

  <!-- Connection Lines -->
  <path d="M 270 210 H 335" stroke="#a476ff" stroke-width="2.5" stroke-dasharray="6 4" />
  <path d="M 270 290 H 335" stroke="#6ee7b7" stroke-width="2.5" />
  <path d="M 485 250 H 545" stroke="#a476ff" stroke-width="2.5" />

  <!-- PZEM Sensor -->
  <rect x="335" y="185" width="150" height="130" rx="12" fill="#181822" stroke="#6ee7b755" stroke-width="2" />
  <text x="410" y="228" fill="#6ee7b7" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">PZEM-004T</text>
  <text x="410" y="254" fill="#a0a0b5" font-family="monospace" font-size="12" text-anchor="middle">AC Energy</text>
  <text x="410" y="274" fill="#a0a0b5" font-family="monospace" font-size="12" text-anchor="middle">V · I · W · kWh</text>
  <circle cx="410" cy="296" r="5" fill="#6ee7b7" />

  <!-- OLED Display -->
  <rect x="545" y="160" width="165" height="180" rx="14" fill="#181822" stroke="#ffffff25" stroke-width="2" />
  <rect x="562" y="185" width="131" height="96" rx="6" fill="#090d14" stroke="#a476ff88" stroke-width="1.5" />
  <text x="574" y="207" fill="#a476ff" font-family="monospace" font-size="11">ENERGY MONITOR</text>
  <text x="574" y="229" fill="#dfdfdf" font-family="monospace" font-size="13">230.4 V  1.82 A</text>
  <text x="574" y="249" fill="#6ee7b7" font-family="monospace" font-size="13">419.3 W</text>
  <text x="574" y="269" fill="#a0a0b5" font-family="monospace" font-size="11">1.42 kWh</text>
  <text x="627" y="314" fill="#dfdfdf" font-family="monospace" font-size="12" text-anchor="middle">OLED I2C</text>

  <!-- Title pill -->
  <rect x="40" y="36" width="250" height="34" rx="17" fill="#ffffff08" stroke="#ffffff18" />
  <circle cx="62" cy="53" r="5" fill="#6ee7b7" />
  <text x="76" y="58" fill="#dfdfdf" font-family="sans-serif" font-size="13" font-weight="600">ESP32 · PZEM · OLED</text>
</svg>

